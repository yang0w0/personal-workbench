<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人工作台</title><style>
:root{--ink:#172033;--muted:#687087;--line:#e5e8f0;--paper:#fff;--wash:#f5f7fb;--brand:#4b5fd6;--brandwash:#eef0ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;background:var(--wash)}header{height:70px;padding:0 32px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line)}h1{margin:0;font-size:20px}h2{margin:0;font-size:16px}button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:9px 13px;color:#fff;background:var(--brand)}.secondary{background:#edf0f9;color:#334}.add{border-radius:20px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}main{max-width:1180px;padding:0 24px;margin:26px auto}.status{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted)}.status.ok{color:#117a51;border-color:#b9e4d3;background:#f4fcf8}.workspace{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;margin-top:18px}.sidebar,section{background:#fff;border:1px solid var(--line);border-radius:12px}.sidebar{height:max-content;padding:12px;position:sticky;top:16px}.nav-title{padding:4px 10px 8px;font-weight:700;font-size:12px;color:var(--muted)}.nav-link{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border-radius:8px;background:transparent;color:var(--ink);text-align:left}.nav-link:hover,.nav-link.active{background:var(--brandwash);color:#3448c5}.nav-symbol{width:18px;text-align:center;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.wide{grid-column:1/-1}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}.section-note,.empty,.card-meta,.meta{font-size:12px;color:var(--muted)}section{padding:18px}.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;min-height:50px}.icon-card{position:relative;display:flex;min-height:114px;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:10px 7px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;text-align:center;box-shadow:0 1px 2px #1720330d;user-select:none}.icon-card:hover,.icon-card:focus{border-color:#aeb8f1;background:#fafbff;box-shadow:0 5px 16px #4b5fd61c;transform:translateY(-1px)}.icon-card.dragging{opacity:.4}.item-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--brandwash);color:var(--brand);font-size:21px;overflow:hidden}.link-card .item-icon{background:#e8f7f0;color:#117a51}.item-icon img{width:100%;height:100%;object-fit:cover}.card-title,.card-meta{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-title{font-size:12px}.list{margin:0;padding:0;list-style:none}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item-main{flex:1;min-width:0}.badge{margin-left:6px;padding:1px 7px;border-radius:99px;background:#fff2d9;color:#9a5b00;font-size:12px}.modal[hidden],.context-menu[hidden]{display:none}.modal{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#17203366}.dialog{width:min(540px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:22px;border-radius:14px;background:#fff;box-shadow:0 18px 60px #17203355}.dialog-head{display:flex;justify-content:space-between;align-items:center}.icon-button{padding:3px 9px;background:#edf0f9;color:#334;font-size:20px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cbd1de;border-radius:7px;font:inherit}textarea{min-height:82px;resize:vertical}.field-note,.notice{font-size:12px;color:var(--muted);margin:5px 0}.notice{min-height:18px;color:#117a51}.context-menu{position:fixed;z-index:20;min-width:142px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px #17203330}.menu-button{display:block;width:100%;padding:8px 10px;color:var(--ink);background:transparent;text-align:left}.menu-button:hover{background:var(--brandwash)}.menu-button.danger{color:var(--danger)}@media(max-width:760px){header{height:auto;padding:14px;align-items:flex-start;gap:10px;flex-direction:column}main{padding:0 14px}.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;padding:8px}.nav-title{display:none}.nav-link{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<header><h1>个人工作台</h1><div class="actions"><button class="secondary" id="connect">重新连接</button><button class="secondary" id="scan">扫描并同步</button><button class="add" id="openAdd">＋ 新增</button></div></header>
<main><div id="status" class="status">正在检查本地服务……</div><div class="workspace"><aside class="sidebar"><div class="nav-title">内容分类</div><button class="nav-link active" data-view="all"><span class="nav-symbol">▦</span>全部内容</button><button class="nav-link" data-view="frequent"><span class="nav-symbol">★</span>常用</button><button class="nav-link" data-view="script"><span class="nav-symbol">▣</span>脚本</button><button class="nav-link" data-view="link"><span class="nav-symbol">↗</span>网址</button><button class="nav-link" data-view="pending"><span class="nav-symbol">!</span>待补充</button></aside><div class="grid">
<section class="wide content-section" data-section="frequent"><div class="section-head"><h2>常用</h2><span class="section-note">最近和常用的快捷入口</span></div><div class="icon-grid" id="frequent"></div></section>
<section class="content-section" data-section="script"><div class="section-head"><h2>脚本</h2><span class="section-note">点击运行 · 可拖动排序</span></div><div class="icon-grid" id="scripts"></div></section>
<section class="content-section" data-section="link"><div class="section-head"><h2>网址</h2><span class="section-note">点击打开 · 可拖动排序</span></div><div class="icon-grid" id="links"></div></section>
<section class="wide content-section" data-section="pending"><div class="section-head"><h2>待补充信息</h2><span class="section-note">完成分类后显示为快捷图标</span></div><ul class="list" id="pending"></ul></section>
</div></div></main>
<div class="context-menu" id="contextMenu" hidden><button class="menu-button" id="menuEdit">编辑信息</button><button class="menu-button danger" id="menuDelete">删除</button></div>
<div class="modal" id="addModal" hidden><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2 id="dialogTitle">新增内容</h2><button class="icon-button" id="closeAdd" aria-label="关闭">×</button></div><label for="category">类别</label><select id="category"><option value="script">小脚本</option><option value="link">网址链接</option></select><label for="title">名称</label><input id="title" placeholder="例如：日志清理脚本"><label for="description">说明</label><input id="description" placeholder="用途或备注"><label for="tags">标签</label><input id="tags" placeholder="用英文逗号分隔，例如：工作,常用"><label for="iconFile">自定义图标（可选）</label><input id="iconFile" type="file" accept="image/*"><p class="field-note">请选择 1.5MB 以下的本地图片。</p><div id="scriptFields"><label for="scriptFile">直接添加本地脚本文件（可选）</label><input id="scriptFile" type="file"><p class="field-note">选择文件后会自动读取内容、名称和后缀；也可继续在下方修改。</p><label for="extension">文件后缀</label><input id="extension" value="ps1"><label for="content">脚本内容</label><textarea id="content" placeholder="可直接选择本地文件，或在这里粘贴/编写代码"></textarea></div><div id="linkFields" hidden><label for="url">完整网址</label><input id="url" type="url" placeholder="https://example.com"></div><p id="notice" class="notice"></p><div class="actions"><button id="save">保存到本地工作台</button><button class="secondary" id="cancelAdd">取消</button></div></div></div>
<script>
'use strict';const API='http://127.0.0.1:8765/api',nativeInvoke=window.__TAURI__?.core?.invoke,$=id=>document.getElementById(id);let connected=false,editingId=null,selectedItem=null,currentView='all',iconData='';
function message(t,g=true){$('notice').textContent=t;$('notice').style.color=g?'#117a51':'#b42318'}function timestamp(v){const n=Number(v);return Number.isFinite(n)?n*1000:(Date.parse(v)||0)}function score(x){return(x.openCount||0)*12+(x.lastOpenedAt?Math.max(0,30-(Date.now()-timestamp(x.lastOpenedAt))/86400000):0)}function sortItems(x){return[...x].sort((a,b)=>Number.isFinite(a.order)&&Number.isFinite(b.order)?a.order-b.order:score(b)-score(a))}function setCategory(){const s=$('category').value==='script';$('scriptFields').hidden=!s;$('linkFields').hidden=s}function resetForm(){editingId=null;iconData='';$('dialogTitle').textContent='新增内容';$('save').textContent='保存到本地工作台';$('title').value=$('description').value=$('tags').value=$('content').value=$('url').value='';$('extension').value='ps1';$('iconFile').value=$('scriptFile').value='';message('')}function showModal(i){$('addModal').hidden=false;resetForm();if(i){editingId=i.id;iconData=i.icon||'';$('dialogTitle').textContent='编辑快捷方式';$('save').textContent='保存修改';$('title').value=i.title||'';$('description').value=i.description||'';$('tags').value=(i.tags||[]).join(',');$('category').value=i.category==='link'?'link':'script';message('可修改名称、说明、标签和图标。')}setCategory();$('title').focus()}function closeModal(){$('addModal').hidden=true}function iconElement(i){const e=document.createElement('span');e.className='item-icon';if(i.icon){const im=document.createElement('img');im.src=i.icon;im.alt='';e.append(im)}else e.textContent=i.category==='link'?'↗':'▣';return e}function makeIcon(i){const c=document.createElement('button');c.className='icon-card '+(i.category==='link'?'link-card':'');c.draggable=true;c.dataset.id=i.id;c.title=`${i.category==='link'?'打开网址':'运行脚本'}：${i.title}`;c.append(iconElement(i));const t=document.createElement('span');t.className='card-title';t.textContent=i.title;const m=document.createElement('span');m.className='card-meta';m.textContent=i.description||i.tags?.join(' · ')||(i.category==='link'?'网址':'脚本');c.append(t,m);c.onclick=()=>openItem(i);c.oncontextmenu=e=>{e.preventDefault();selectedItem=i;const q=$('contextMenu');q.style.left=Math.min(e.clientX,innerWidth-160)+'px';q.style.top=Math.min(e.clientY,innerHeight-100)+'px';q.hidden=false};c.ondragstart=e=>{c.classList.add('dragging');e.dataTransfer.effectAllowed='move'};c.ondragend=()=>{c.classList.remove('dragging');persistOrder(c.parentElement)};return c}function putIcons(id,x,empty){const g=$(id);g.replaceChildren();if(!x.length){g.innerHTML=`<p class="empty">${empty}</p>`;return}x.forEach(i=>g.append(makeIcon(i)))}function makePending(i){const li=document.createElement('li');li.className='item';li.innerHTML='<div class="item-main"><strong></strong><span class="badge">待补充</span><div class="meta"></div></div>';li.querySelector('strong').textContent=i.title;li.querySelector('.meta').textContent=[i.description,i.tags?.join(' · ')].filter(Boolean).join(' · ');const a=document.createElement('div');a.className='actions';const e=document.createElement('button');e.className='secondary';e.textContent='补充信息';e.onclick=()=>showModal(i);const d=document.createElement('button');d.className='secondary';d.textContent='删除';d.onclick=()=>deleteItem(i);a.append(e,d);li.append(a);return li}function render(x){const done=sortItems(x.filter(i=>i.status==='complete')),pending=x.filter(i=>i.status==='needs_metadata');putIcons('frequent',done.slice().sort((a,b)=>score(b)-score(a)).slice(0,6),'使用一次脚本或网址后，这里会自动出现。');putIcons('scripts',done.filter(i=>i.category==='script'),'暂无脚本。');putIcons('links',done.filter(i=>i.category==='link'),'暂无网址。');const l=$('pending');l.replaceChildren();pending.length?pending.forEach(i=>l.append(makePending(i))):l.innerHTML='<li class="empty">没有待补充文件。</li>';applyView()}function applyView(){document.querySelectorAll('.content-section').forEach(s=>s.hidden=currentView!=='all'&&s.dataset.section!==currentView);document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView))}
async function request(path,o){const body=o?.body?JSON.parse(o.body):{};if(nativeInvoke){const map={'/status':'get_status','/items':'get_items','/scan':'scan_items','/items/metadata':'complete_metadata','/items/hide':'hide_item','/items/open':'open_item','/items/update':'update_item','/items/delete':'delete_item','/items/reorder':'reorder_items'};if(path==='/items'&&o?.method==='POST')return nativeInvoke('create_item',{input:body});return nativeInvoke(map[path],path==='/status'||path==='/items'?undefined:{input:body})}const r=await fetch(API+path,o),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}async function connect(){try{const d=await request('/status');connected=true;$('status').textContent=(nativeInvoke?'客户端已连接，数据目录：':'本地服务已连接，数据目录：')+d.dataPath;$('status').className='status ok';render((await request('/items')).items)}catch{$('status').textContent='无法连接本地工作台。';$('status').className='status'}}async function openItem(i){try{await request('/items/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:i.id})});await connect()}catch(e){message(e.message,false);showModal(i)}}async function deleteItem(i){if(!confirm(`确定删除“${i.title}”吗？关联的本地脚本文件也会被删除。`))return;try{await request('/items/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:i.id})});await connect()}catch(e){alert(e.message)}}async function persistOrder(g){const ids=[...g.querySelectorAll('.icon-card')].map(x=>x.dataset.id);if(ids.length<2)return;try{await request('/items/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});await connect()}catch(e){console.error(e)}}
document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;applyView()});document.querySelectorAll('.icon-grid').forEach(g=>g.ondragover=e=>{e.preventDefault();const d=document.querySelector('.dragging');if(!d)return;const a=[...g.querySelectorAll('.icon-card:not(.dragging)')].find(c=>e.clientY<c.getBoundingClientRect().top+c.offsetHeight/2);a?g.insertBefore(d,a):g.append(d)});document.addEventListener('click',()=>{$('contextMenu').hidden=true});$('contextMenu').onclick=e=>e.stopPropagation();$('menuEdit').onclick=()=>{if(selectedItem)showModal(selectedItem);$('contextMenu').hidden=true};$('menuDelete').onclick=()=>{if(selectedItem)deleteItem(selectedItem);$('contextMenu').hidden=true};$('openAdd').onclick=()=>showModal();$('closeAdd').onclick=$('cancelAdd').onclick=closeModal;$('addModal').onclick=e=>{if(e.target===$('addModal'))closeModal()};$('category').onchange=setCategory;$('connect').onclick=connect;$('scan').onclick=async()=>{try{const d=await request('/scan',{method:'POST'});render(d.items);$('status').textContent=d.discovered.length?`扫描完成：发现 ${d.discovered.length} 个新文件。`:'扫描完成，已同步本地改动。';$('status').className='status ok'}catch(e){$('status').textContent=e.message;$('status').className='status'}};$('iconFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000)return message('图片请控制在 1.5MB 以内。',false);iconData=await readData(f);message('已选择自定义图标。')};$('scriptFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('content').value=await f.text();const p=f.name.lastIndexOf('.');$('title').value=$('title').value||f.name.slice(0,p>0?p:undefined);if(p>0)$('extension').value=f.name.slice(p+1);message('已导入本地脚本文件，可再修改内容或名称。')};function readData(f){return new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}$('save').onclick=async()=>{if(!connected)return message('请先连接本地工作台。',false);const b={category:$('category').value,title:$('title').value,description:$('description').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),extension:$('extension').value,content:$('content').value,url:$('url').value,icon:iconData};try{await request(editingId?'/items/update':'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(editingId?{id:editingId,...b}:b)});closeModal();await connect()}catch(e){message(e.message,false)}};setCategory();connect();
</script><script>
/* 仅在实际分类栏排序：为桌面 WebView 补齐拖拽数据，并统一处理网格落点。 */
(()=>{
  let dragging=null,sourceGrid=null;
  const saveOrder=async grid=>{
    const ids=[...grid.querySelectorAll('.icon-card')].map(card=>card.dataset.id);
    if(ids.length<2)return;
    const body={ids};
    try{
      if(window.__TAURI__?.core?.invoke)await window.__TAURI__.core.invoke('reorder_items',{input:body});
      else {const response=await fetch('http://127.0.0.1:8765/api/items/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw Error('保存排序失败');}
    }catch(error){console.error('保存排序失败：',error);}
  };
  document.addEventListener('dragstart',event=>{
    const card=event.target.closest?.('.icon-card');
    if(!card)return;
    const grid=card.closest('.icon-grid');
    if(!grid||grid.id==='frequent'){event.preventDefault();event.stopPropagation();return;}
    dragging=card;sourceGrid=grid;card.classList.add('dragging');
    event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',card.dataset.id);
  },true);
  document.addEventListener('dragover',event=>{
    const grid=event.target.closest?.('.icon-grid');
    if(!dragging||!grid||grid!==sourceGrid)return;
    event.preventDefault();event.stopPropagation();
    const cards=[...grid.querySelectorAll('.icon-card:not(.dragging)')];
    const target=cards.reduce((closest,card)=>{
      const rect=card.getBoundingClientRect(),dx=event.clientX-(rect.left+rect.width/2),dy=event.clientY-(rect.top+rect.height/2);
      const distance=dx*dx+dy*dy;
      return !closest||distance<closest.distance?{card,distance}:closest;
    },null);
    if(!target){grid.append(dragging);return;}
    const rect=target.card.getBoundingClientRect();
    const before=event.clientY<rect.top+rect.height/2||(event.clientY<rect.bottom&&event.clientX<rect.left+rect.width/2);
    grid.insertBefore(dragging,before?target.card:target.card.nextSibling);
  },true);
  document.addEventListener('drop',event=>{if(dragging){event.preventDefault();event.stopPropagation();}},true);
  document.addEventListener('dragend',event=>{
    if(!dragging)return;
    event.stopPropagation();const grid=sourceGrid;dragging.classList.remove('dragging');dragging=null;sourceGrid=null;saveOrder(grid);
  },true);
})();
</script></body></html>
