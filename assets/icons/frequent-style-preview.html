<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>常用栏图标方向</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#f5f6f8;color:#17202d;font-family:"Microsoft YaHei",sans-serif}
  main{width:1400px;margin:0 auto;padding:56px 64px 64px}.intro{margin:0 0 36px;font-size:25px;color:#5a6575}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
  section{background:#fff;border-radius:28px;padding:28px 30px 30px;box-shadow:0 5px 18px #1a23300d}h2{margin:0 0 8px;font-size:30px}p{margin:0 0 25px;font-size:18px;color:#667284}.icons{display:flex;justify-content:space-between;gap:16px}.unit{width:128px;text-align:center}.tile{width:128px;height:128px;border-radius:30px;display:grid;place-items:center}.unit span{display:block;margin-top:12px;font-size:15px;color:#667284}.object .tile{background:linear-gradient(145deg,#fff3e4,#ffd3b9)}.object .tile:nth-child(n){box-shadow:inset 0 0 0 2px #edb08f}
  .abstract .tile{background:#192232}.utility .tile{background:#e6f1ed}.pixel .tile{background:#30215c;image-rendering:pixelated}
  svg{width:96px;height:96px;overflow:visible}.stroke{fill:none;stroke:#202d3d;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.object .stroke{stroke:#a54f3d}.abstract .stroke{stroke:#84e9e1}.utility .stroke{stroke:#1a7268}.pixel .stroke{stroke:#f9dc72;stroke-width:9;stroke-linecap:square;stroke-linejoin:miter}
  .abstract .fill{fill:#a673ff}.utility .fill{fill:#f2ad4d}.pixel .fill{fill:#ff7ac8}.object .fill{fill:#f37955}
</style>
<main>
  <h1>常用栏图标 · 图形语言草图</h1>
  <p class="intro">每个方案的“启动 / 收藏 / 文件 / 搜索”都采用不同的物体与隐喻，而非仅换色。</p>
  <div class="grid">
    <section class="object"><h2>1 · 物件插画</h2><p>用看得懂的小物件：火箭、票券、抽屉柜、望远镜。</p><div class="icons">
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M51 12c19 10 27 29 22 50L57 78 38 60C39 38 45 21 51 12z"/><path class="stroke" d="M38 60 24 74m33 4 12 12M48 42h1"/><path fill="#fff" d="M49 29a8 8 0 1 1 0 16 8 8 0 0 1 0-16z"/></svg></div><span>启动</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M15 31 80 18l8 43-65 13z"/><path class="stroke" d="m30 28 38 39M24 53l49-10"/><circle cx="26" cy="37" r="6" fill="#fff"/></svg></div><span>收藏</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><rect class="fill" x="20" y="24" width="60" height="58" rx="6"/><path class="stroke" d="M20 44h60M34 55h32M34 70h32"/><circle cx="28" cy="59" r="3" fill="#fff"/><circle cx="28" cy="74" r="3" fill="#fff"/></svg></div><span>文件</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="stroke" d="m26 29 25 15-25 15zm25 0 25 15-25 15M32 33l-8-10m47 10 8-10"/><path class="stroke" d="m46 60-11 20m19-20 11 20"/></svg></div><span>搜索</span></div>
    </div></section>
    <section class="abstract"><h2>2 · 抽象符号</h2><p>更像一套独立品牌符号：轨道、结、层叠、雷达。</p><div class="icons">
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="stroke" d="M26 63c-12-22 4-43 28-37 15 4 25 20 16 38"/><path class="stroke" d="M33 74c22 9 42-8 35-30"/><circle class="fill" cx="72" cy="28" r="8"/></svg></div><span>启动</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="stroke" d="M50 77C15 58 24 25 45 33l5 7 5-7c21-8 30 25-5 44z"/><circle class="fill" cx="38" cy="52" r="6"/><circle class="fill" cx="62" cy="52" r="6"/></svg></div><span>收藏</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M50 16 80 36 50 56 20 36z"/><path class="stroke" d="m20 50 30 20 30-20M20 64l30 20 30-20"/></svg></div><span>文件</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><circle class="stroke" cx="50" cy="50" r="31"/><circle class="fill" cx="50" cy="50" r="8"/><path class="stroke" d="M50 19v15m31 16H66m-16 31V66"/></svg></div><span>搜索</span></div>
    </div></section>
    <section class="utility"><h2>3 · 微型工具</h2><p>像真实桌面工具：拨杆、书签、工具箱、手持望远镜。</p><div class="icons">
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="stroke" d="M28 75h44"/><path class="stroke" d="M50 75V42"/><circle class="fill" cx="50" cy="29" r="13"/><path class="stroke" d="M28 75c0-12 10-20 22-20s22 8 22 20"/></svg></div><span>启动</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M29 17h42v65L50 67 29 82z"/><path class="stroke" d="M39 28h22"/></svg></div><span>收藏</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M18 40h64v39H18z"/><path class="stroke" d="M38 40V30h24v10M18 55h64"/><circle cx="37" cy="66" r="5" fill="#fff"/><circle cx="63" cy="66" r="5" fill="#fff"/></svg></div><span>文件</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="m23 37 38-15 13 32-38 15z"/><path class="stroke" d="m62 25 10-8m2 37 10 8M44 60l-10 23"/><circle cx="51" cy="40" r="10" fill="#e6f1ed"/></svg></div><span>搜索</span></div>
    </div></section>
    <section class="pixel"><h2>4 · 像素徽章</h2><p>复古像素的不同轮廓：彗星、旗帜、磁盘、扫描器。</p><div class="icons">
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M22 70h16V54h16V38h16v16h-9v16H45v12H29V70z"/><path class="stroke" d="M70 20v18M78 28H62"/></svg></div><span>启动</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M28 20h44v50H52L40 82V70H28z"/><path class="stroke" d="M40 31h20M40 42h20"/></svg></div><span>收藏</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="fill" d="M22 20h56v60H22z"/><path class="stroke" d="M34 20v25h32V20M35 66h30"/><rect x="43" y="57" width="14" height="16" fill="#30215c"/></svg></div><span>文件</span></div>
      <div class="unit"><div class="tile"><svg viewBox="0 0 100 100"><path class="stroke" d="M20 72V28h52v44z"/><path class="fill" d="M31 60h12V48h12V36h12v24H55v12H31z"/><path class="stroke" d="m72 65 10 10"/></svg></div><span>搜索</span></div>
    </div></section>
  </div>
</main>
</html>
